name: Profile Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: write

jobs:
  refresh-recent-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      # postinstall exits early under CI via is-ci, so this only installs packages.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh profile data
        env:
          PROFILE_USERNAME: Adonis0123
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECENT_REPO_COUNT: "2"
          FIXED_FEATURED_REPOS: Adonis0123/sideby,Adonis0123/agent-env,Adonis0123/adonis-skills,Adonis0123/hermes-kit,Adonis0123/adonis-pi,Adonis0123/gemini-chrome-autoinstall
          FALLBACK_REPOS: ""
          BLOCKED_REPOS: Adonis0123/Adonis0123,Adonis0123/nookmark
        run: node scripts/select-recent-repos.mjs

      # fail_on_error throws before the card is written, so a failed fetch keeps
      # the committed card instead of replacing it with an error card.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: stats
          options: username=Adonis0123&show_icons=true&hide_border=true&rank_icon=github&theme=transparent&icon_color=58A6FF
          path: assets/cards/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: "2.3.1"
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: top-langs
          options: username=Adonis0123&layout=compact&hide_border=true&theme=transparent&langs_count=8
          path: assets/cards/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: "2.3.1"
          fail_on_error: "true"

      - name: Commit and push changes
        run: |
          git add README.md data/profile.projects.json assets
          if git diff --cached --quiet; then
            echo "No profile updates to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh profile data"
          git push

      # The card steps use continue-on-error so the rest still gets committed;
      # fail here so a card the README points at but never got generated is visible.
      - name: Check stats cards exist
        run: |
          for card in assets/cards/stats.svg assets/cards/top-langs.svg; do
            if [ ! -s "$card" ]; then
              echo "::error::$card is missing; re-run the workflow or check the card step logs."
              exit 1
            fi
          done
