<svg xmlns="http://www.w3.org/2000/svg" width="760" height="266" viewBox="0 0 760 266" role="img" aria-labelledby="title desc">
<title id="title">Adonis's terminal</title>
<desc id="desc">An animated terminal installing adonis-skills with npx skills, adding the hermes-kit tap to Hermes, and launching pi through the adonis-pi launcher.</desc>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; white-space: pre; fill: #e6edf3; }
.title { font-size: 12px; fill: #8b949e; }
.prompt { fill: #3fb950; font-weight: 700; }
.repo { fill: #79c0ff; }
.flag { fill: #d2a8ff; }
.note { fill: #8b949e; }
.cursor { fill: #e6edf3; }
</style>
<defs>
<clipPath id="type0"><rect x="41.2" y="62" height="22" width="0"><animate attributeName="width" dur="15s" repeatCount="indefinite" values="0;0;528.6;528.6" keyTimes="0;0.0400;0.1671;1"/></rect></clipPath>
<clipPath id="type2"><rect x="41.2" y="114" height="22" width="0"><animate attributeName="width" dur="15s" repeatCount="indefinite" values="0;0;373.8;373.8" keyTimes="0;0.2533;0.3429;1"/></rect></clipPath>
<clipPath id="type4"><rect x="41.2" y="166" height="22" width="0"><animate attributeName="width" dur="15s" repeatCount="indefinite" values="0;0;47.0;47.0" keyTimes="0;0.4333;0.4437;1"/></rect></clipPath>
</defs>
<rect x="0.5" y="0.5" width="759" height="265" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 36 H759.5" stroke="#30363d"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="380" y="22" text-anchor="middle" class="title">adonis@shenzhen: ~ — zsh</text>
<g>
<animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.94;0.98;1"/>
<g opacity="0"><text x="24" y="78" class="prompt">$</text><text x="41.2" y="78" clip-path="url(#type0)"><tspan class="cmd">npx skills add </tspan><tspan class="repo">adonis0123/adonis-skills</tspan><tspan class="flag"> --skill workflow-gate</tspan></text><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.0233"/></g>
<text x="24" y="104" class="note" opacity="0"># review loops, workflow gates, MCP setup and Git delivery for coding agents<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.2000"/></text>
<g opacity="0"><text x="24" y="130" class="prompt">$</text><text x="41.2" y="130" clip-path="url(#type2)"><tspan class="cmd">hermes skills tap add </tspan><tspan class="repo">Adonis0123/hermes-kit</tspan></text><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.2367"/></g>
<text x="24" y="156" class="note" opacity="0"># Hermes plugins, skills and field notes<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.3800"/></text>
<g opacity="0"><text x="24" y="182" class="prompt">$</text><text x="41.2" y="182" clip-path="url(#type4)"><tspan class="cmd">pin </tspan><tspan class="flag">1</tspan></text><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.4167"/></g>
<text x="24" y="208" class="note" opacity="0"># pi with a permission gate, attention notify and AskUserQuestion<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.4933"/></text>
<g opacity="0"><text x="24" y="234" class="prompt">$</text><rect x="41.2" y="221" width="9" height="17" class="cursor"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.5467"/></g>
</g>
</svg>
